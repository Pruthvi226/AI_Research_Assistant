name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run backend syntax and unit checks
        env:
          GEMINI_API_KEY: ''
          DATA_FOLDER: /tmp/scientia-ci
        run: |
          pip install -r backend/requirements_docker.txt
          python scripts/verify_backend.py --smoke

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build React app
        env:
          CI: "true"
          PUBLIC_URL: /AI_Research_Assistant/
        run: npm run build
      - name: Frontend unit tests
        run: npm test
        env:
          CI: 'true'
      - name: Frontend lint
        run: npm run lint
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Production browser and accessibility checks
        env:
          CI: 'true'
          PUBLIC_URL: /AI_Research_Assistant/
          E2E_BASE_PATH: /AI_Research_Assistant/
        run: npm run test:e2e

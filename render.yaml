# Free/demo deployment configuration only. Local account records and files are
# ephemeral here; configure approved durable storage before private production use.
services:
  - type: web
    name: scientia-research-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/system/readiness
    numInstances: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: STORAGE_MODE
        value: ephemeral
      - key: HOSTING_TIER
        value: render-free
      - key: CORS_ORIGINS
        value: https://pruthvi226.github.io
      - key: MAX_UPLOAD_MB
        value: '20'
      - key: JOB_WORKERS
        value: '1'
      - key: JOB_MAX_IN_FLIGHT
        value: '5'
      - key: RATE_LIMIT_PER_MINUTE
        value: '60'
      - key: AUTH_RATE_LIMIT_PER_MINUTE
        value: '10'
      - key: AUTH_SESSION_TTL_SECONDS
        value: '604800'

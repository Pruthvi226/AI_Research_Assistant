# Free demo hosting. Backend files and SQLite reset on restart/redeploy/spin-down.
services:
  - type: web
    name: scientia-research-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/system/readiness
    numInstances: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: REQUIRE_ADMIN_AUTH
        value: 'true'
      - key: GEMINI_API_KEY
        sync: false
      - key: STORAGE_MODE
        value: ephemeral
      - key: HOSTING_TIER
        value: render-free
      - key: CORS_ORIGINS
        value: https://pruthvi226.github.io
      - key: MAX_UPLOAD_MB
        value: '20'
      - key: JOB_WORKERS
        value: '1'
      - key: JOB_MAX_IN_FLIGHT
        value: '5'
      - key: RATE_LIMIT_PER_MINUTE
        value: '60'
